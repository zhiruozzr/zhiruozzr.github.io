# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" # Currently available options are "default", "air"
# Basic Site Settings
title: "Zhiruo Zhang (张芷若)"
description: "Ph.D. Candidate in Economics and Econometrics at The University of Adelaide"
url: ""   # <- change this to your actual live URL
baseurl: ""   # leave blank if the site is served at root of domain

# Author Info
author:
  name: "Zhiruo (Rachel) Zhang 张芷若"
  location: "Adelaide, Australia"
  email: "zhiruo.zhang@adelaide.edu.au"
  github: "zhiruozzr"
  linkedin: "https://www.linkedin.com/in/zhiruo-zhang-016b86179/"
  orcid: "https://orcid.org/0000-0002-4887-3068"
  googlescholar: "https://scholar.google.com/citations?user=PS_CX0AAAAAJ"

# Social Profiles for structured data / links
social:
  type: Person
  name: "Zhiruo Zhang"
  links:
    - https://github.com/zhiruozzr
    - https://www.linkedin.com/in/zhiruo-zhang-016b86179/
    - https://scholar.google.com/citations?user=PS_CX0AAAAAJ
    - https://orcid.org/0000-0002-4887-3068

# SEO / Open Graph
og_image: "images/profile.jpeg"
og_description: "Zhiruo (Rachel) Zhang is a Ph.D. candidate in Economics and Econometrics at The University of Adelaide."

# Permalinks & Time settings
permalink: /:categories/:title/
timezone: Etc/UTC

# Markdown & Rendering
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo, rsquo, ldquo, rdquo
lsi: false
incremental: false
excerpt_separator: "\n\n"

# Collections (if you use these)
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults for pages, posts, etc.
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author_profile: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true

# Plugins & Features
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Comments & Analytics (adapt or disable as needed)
comments:
  provider: false

analytics:
  provider: false

# Include / Exclude settings
include:
  - .htaccess
keep_files:
  - .git
  - .svn
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .sass-cache
  - node_modules
  - vendor
  - log

# Build settings
future: true

# RSS / feed
read_more: "disabled"

# SEO verifications (if needed)
google_site_verification: ""
bing_site_verification: ""
alexa_site_verification: ""
yandex_site_verification: ""
